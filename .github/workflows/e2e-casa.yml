name: E2E Casa (Playwright)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e-casa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar Optimus
        run: pip install -e .
      - name: Instalar dependências Playwright
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar interface Casa
        run: npm run test:e2e
