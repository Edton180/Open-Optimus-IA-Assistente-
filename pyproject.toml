[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optimus-assistente"
version = "0.1.0"
description = "Optimus: assistente de IA pessoal, local e autônomo, com voz, internet e controle do PC (Windows e Linux)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Edton Braz" }]
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "ddgs>=9.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Voz: reconhecimento offline (faster-whisper), microfone, vozes naturais offline (Kokoro),
# vozes neurais online (Edge) e vozes do sistema (pyttsx3)
voz = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "kokoro-onnx>=0.4",
       "edge-tts>=6.1", "miniaudio>=1.59", "pyttsx3>=2.90"]
# Casa inteligente: Bluetooth direto e leitura de PDF na base de conhecimento
casa = ["bleak>=0.22"]
documentos = ["pypdf>=4.0"]
# Controle de mouse, teclado e capturas de tela
desktop = ["pyautogui>=0.9", "mss>=9.0", "pyperclip>=1.8"]
completo = ["optimus-assistente[voz,desktop,casa,documentos]"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
optimus = "optimus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["optimus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
