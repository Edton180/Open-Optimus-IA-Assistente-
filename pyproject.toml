[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optimus-assistente"
version = "0.1.0"
description = "Optimus: assistente de IA pessoal, local e autônomo, com voz, internet e controle do PC (Windows e Linux)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Edton Braz" }]
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "ddgs>=9.0",
    "segno>=1.6",  # QR code para abrir no celular (puro Python, pequeno)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Voz: reconhecimento offline (faster-whisper), microfone, vozes naturais offline (Kokoro),
# vozes neurais online (Edge) e vozes do sistema (pyttsx3)
voz = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "kokoro-onnx>=0.4",
       "edge-tts>=6.1", "miniaudio>=1.59", "pyttsx3>=2.90"]
# Casa inteligente: Bluetooth direto e leitura de PDF na base de conhecimento
casa = ["bleak>=0.22"]
documentos = ["pypdf>=4.0", "reportlab>=4.0", "python-docx>=1.1"]
# Suite PDF local: conversão de imagens e renderização de páginas (Tesseract é instalado no SO)
pdf = ["optimus-assistente[documentos]", "Pillow>=10.0", "pypdfium2>=4.28", "pytesseract>=0.3.10"]
# Controle de mouse, teclado e capturas de tela
desktop = ["pyautogui>=0.9", "mss>=9.0", "pyperclip>=1.8"]
# Cofre do sistema para as chaves de API (Windows, macOS e Linux)
seguranca = ["keyring>=25"]
# Estúdio de voz: transcrever, legendar, traduzir e dublar (ffmpeg incluído), vozes em
# português do Brasil e em outros 17 idiomas
estudio = ["numpy>=1.24", "imageio-ffmpeg>=0.4", "faster-whisper>=1.0", "edge-tts>=6.1",
           "kokoro-onnx>=0.4", "miniaudio>=1.59", "sherpa-onnx>=1.10,<2", "pypdf>=4",
           "sounddevice>=0.4", "pyautogui>=0.9", "pyperclip>=1.8"]
# Separar a voz da música (Demucs, MIT). Grande: instala o PyTorch.
isolar = ["demucs>=4"]
# Clonagem e conversor de voz (Chatterbox, MIT). Grande: instala o PyTorch.
clonagem = ["chatterbox-tts>=0.1"]
# Clonagem, vozes por descrição e 600+ idiomas (OmniVoice, Apache-2.0). Instala o PyTorch.
omnivoice = ["omnivoice>=0.2"]
# QR code para abrir o Optimus no celular
celular = ["segno>=1.6"]
completo = ["optimus-assistente[voz,desktop,casa,pdf,seguranca,celular,estudio]"]
dev = ["pytest>=8", "ruff>=0.4", "numpy>=1.24", "imageio-ffmpeg>=0.4", "pypdf>=4.0", "reportlab>=4.0", "python-docx>=1.1", "Pillow>=10.0", "pypdfium2>=4.28", "pytesseract>=0.3.10"]

[project.scripts]
optimus = "optimus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["optimus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
